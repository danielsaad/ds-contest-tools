name: CI PR Validation

on:
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened, edited ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Run Tests and Dry Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check changed files
      id: changes
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ "$EVENT_NAME" != "pull_request" ]; then
          echo "SHOULD_BUILD=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if ! CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null); then
          echo "SHOULD_BUILD=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if printf '%s\n' "$CHANGED_FILES" | grep -qvE '^(docs/|README\.md$|\.gitignore$|\.github/CODEOWNERS$)'; then
          echo "SHOULD_BUILD=true" >> "$GITHUB_OUTPUT"
          echo "🔧 Alterações relevantes detectadas. Build será executado."
        else
          echo "SHOULD_BUILD=false" >> "$GITHUB_OUTPUT"
          echo "ℹ️ Apenas documentação/configuração administrativa alterada. Build ignorado."
        fi

    - name: Set up Python
      if: steps.changes.outputs.SHOULD_BUILD == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"
        
    - name: Install dependencies
      if: steps.changes.outputs.SHOULD_BUILD == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install build
        
    - name: Dry-run Build
      if: steps.changes.outputs.SHOULD_BUILD == 'true'
      run: |
        python -m build
                
  validate-release-version:
    name: Validate Release Version in CHANGELOG
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Verificar se é PR de Release e extrair versão
      id: extract-version
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        TRIMMED_TITLE=$(printf '%s' "$PR_TITLE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
        
        # Extrai versão de formatos como: "1.2.0", "v1.2.0", "Release v1.2.0", "Release 1.2.0", "release: 1.2.0", "chore(release): 1.2.0"
        VERSION=$(printf '%s' "$TRIMMED_TITLE" | grep -oP '^(?:[Rr]elease(?:\s+v?|\:\s*v?)|\bchore\([Rr]elease\)\:\s*v?|v)?\K\d+\.\d+\.\d+$' || true)
        
        if [ -n "$VERSION" ]; then
          echo "IS_RELEASE=true" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 PR de release identificado para a versão: $VERSION"
        else
          echo "IS_RELEASE=false" >> "$GITHUB_OUTPUT"
          echo "ℹ️ Não é um PR de release ('$PR_TITLE'). Validação de versão ignorada."
        fi
        
    - name: Validar CHANGELOG.md
      if: steps.extract-version.outputs.IS_RELEASE == 'true'
      env:
        VERSION: ${{ steps.extract-version.outputs.VERSION }}
      run: |
        # Verifica se existe um cabeçalho '## [X.Y.Z]' no CHANGELOG.md
        if grep -Fq "## [$VERSION]" CHANGELOG.md; then
          echo "Sucesso: Versão $VERSION encontrada no CHANGELOG.md."
        else
          echo "::error::Versão $VERSION NÃO encontrada no CHANGELOG.md. Adicione a seção '## [$VERSION]' no CHANGELOG."
          exit 1
        fi
